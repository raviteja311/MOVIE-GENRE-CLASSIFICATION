[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-genre"
version = "0.1.0"
description = "Classify movie genres from plot descriptions with TF-IDF and linear models."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jetti Raviteja" }]
requires-python = ">=3.11"
dependencies = [
    "joblib",
    "matplotlib",
    "nltk>=3.10.3",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
    "wordcloud",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
movie-genre-eda = "movie_genre.eda:main"
movie-genre-train = "movie_genre.train:main"
movie-genre-predict = "movie_genre.predict:main"
movie-genre-download = "movie_genre.download_data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
