[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-genre"
version = "0.1.0"
description = "Classify movie genres from plot descriptions with TF-IDF and linear models."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jetti Raviteja" }]
requires-python = ">=3.11"
dependencies = [
    "altair",
    "joblib",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
    "streamlit",
    "wordcloud",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
movie-genre-eda = "movie_genre.eda:main"
movie-genre-tune = "movie_genre.tune:main"
movie-genre-train = "movie_genre.train:main"
movie-genre-predict = "movie_genre.predict:main"
movie-genre-download = "movie_genre.download_data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # joblib 1.5.3 sets array.shape when loading the model, which NumPy 2.5 deprecates. Library code only.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.*",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
